[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings
    -m "not experimental and not benchmark"
markers =
    gpu: marks tests as requiring GPU (deselect with '-m "not gpu"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    cpu: marks tests as CPU only
    ci: marks tests that are part of release-gating CI checks
    experimental: marks exploratory or research tests excluded from default release checks
    benchmark: marks performance benchmark tests excluded from default release checks
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
